<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard de productos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="StyleDB.css">
</head>
<body>

  <header class="encabezado">
    <h1>Dashboard De Productos</h1>
    <p>Agrega, edita y controla tu inventario en un solo lugar.</p>
  </header>

  <main class="contenedor">

    <!-- Resumen -->
    <section class="resumen" aria-label="Resumen del inventario">
      <div class="dato">
        <span class="dato-valor" id="statTotal">0</span>
        <span class="dato-etiqueta">Productos</span>
      </div>
      <div class="dato">
        <span class="dato-valor" id="statDisponibles">0</span>
        <span class="dato-etiqueta">Disponibles</span>
      </div>
      <div class="dato dato-destacado">
        <span class="dato-valor" id="statValor">L 0.00</span>
        <span class="dato-etiqueta">Valor de lo disponible</span>
      </div>
    </section>

    <div class="columnas">

      <!-- Formulario -->
      <section class="panel panel-form">
        <h2>Nuevo producto</h2>
        <form id="formProducto" novalidate>
          <label for="inputNombre">Nombre</label>
          <input type="text" id="inputNombre" placeholder="Agregue un producto" maxlength="60" autocomplete="off">

          <label for="inputPrecio">Precio (L)</label>
          <input type="number" id="inputPrecio" placeholder="0.00" min="0" step="0.01">

          <p class="error" id="mensajeError" role="alert" hidden></p>

          <button type="submit" class="btn btn-principal">Agregar producto</button>
        </form>
      </section>

      <!-- Lista -->
      <section class="panel panel-lista">
        <h2>Inventario</h2>
        <ul id="listaProductos" class="lista"></ul>
        <p id="estadoVacio" class="vacio" hidden>
          Aún no hay productos. Completa el formulario para agregar el primero.
        </p>
      </section>

    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="DB.js"></script>
</body>
</html>
