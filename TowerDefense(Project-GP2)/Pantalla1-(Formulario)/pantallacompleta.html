<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tower Defense</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="pantalla1.css" />
  </head>
  <body class="d-flex justify-content-center align-items-center min-vh-100 p-3">
    <form
      action="../Pantalla2-(Juego2D)/pantalla2.html"
      method="get"
      id="formulario"
      class="game-form"
      target="_blank"
    >
      <h2 class="game-title text-center mb-4">TOWER DEFENSE</h2>

      <label class="form-label">Nombre del jugador</label>
      <input type="text" id="nombre" class="form-control mb-3" />

      <label class="form-label">Personaje</label>
      <div id="listaPersonajes" class="row mb-3"></div>

      <!-- Aquí va la dificultad (compañera) -->

      <button type="submit" class="btn btn-warning btn-start w-100">
        Empezar
      </button>
    </form>

    <script>
      const personajes = [
        {
          id: 1,
          nombre: "Caballero",
          imagen: "imagenes/caballero.jpg",
        },
        {
          id: 2,
          nombre: "Mago",
          imagen: "imagenes/mago.jpg",
        },
        {
          id: 3,
          nombre: "Arquero",
          imagen: "imagenes/arquero.jpg",
        },
      ];

      let elegido = null;
      const lista = document.getElementById("listaPersonajes");

      lista.innerHTML = personajes
        .map(
          (p) => `
      <div class="col-4">
        <div class="personaje" data-id="${p.id}">
          <img src="${p.imagen}" alt="${p.nombre}" class="imagen-personaje">
          <div>${p.nombre}</div>
        </div>
      </div>
    `,
        )
        .join("");

      document.querySelectorAll(".personaje").forEach((t) => {
        t.addEventListener("click", () => {
          document
            .querySelectorAll(".personaje")
            .forEach((x) => x.classList.remove("seleccionado"));
          t.classList.add("seleccionado");
          elegido = personajes.find((p) => p.id == t.dataset.id);
        });
      });

      document.getElementById("formulario").addEventListener("submit", (e) => {
        e.preventDefault();

        const nombre = document.getElementById("nombre").value.trim();

        if (nombre === "" || elegido === null) {
          alert("Escribe tu nombre y elige un personaje");
          return;
        }

        const jugador = {
          nombre: nombre,
          personaje: elegido,
        };

        localStorage.setItem("jugador", JSON.stringify(jugador));

        window.location.href = "../Pantalla2-(Juego2D)/Pantalla2.html";
      });
    </script>
  </body>
</html>
