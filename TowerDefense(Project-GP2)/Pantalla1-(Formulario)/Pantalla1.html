<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tower Defense</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="pantalla1.css" />
  </head>
  <body class="d-flex justify-content-center align-items-center min-vh-100 p-3">
    <form
      action="../Pantalla2-(Juego2D)/pantalla2.html"
      method="get"
      id="formulario"
      class="game-form"
      target="_blank"
    >
      <!--Titulo del juego-->
      <h2 class="game-title text-center mb-4">TOWER DEFENSE</h2>

      <!-- Nombre del jugador -->
      <label class="form-label">Nombre del jugador</label>
      <input maxlength="10" type="text" id="nombre" class="form-control mb-3" />

      <!-- Seleccion de Personajes -->
      <label class="form-label">Personaje</label>
      <div id="listaPersonajes" class="row mb-3"></div>

      <!-- Dificultad -->
      <label for="dificultad" class="form-label">Dificultad</label>
      <select id="dificultad" class="form-select mb-3">
        <option value="facil">Fácil</option>
        <option value="medio" selected>Medio</option>
        <option value="dificil">Difícil</option>
      </select>

      <!-- Nivel (Cantidad de Oleadas: 3 a 6) -->
      <label for="nivel" class="form-label">Nivel / Oleadas</label>
      <select id="nivel" class="form-select mb-3">
        <option value="3" selected>Nivel 1 (3 Oleadas)</option>
        <option value="4">Nivel 2 (4 Oleadas)</option>
        <option value="5">Nivel 3 (5 Oleadas)</option>
        <option value="6">Nivel 4 (6 Oleadas)</option>
      </select>

      <!-- Boton inicio de juego -->
      <button type="submit" class="btn btn-warning btn-start w-100">
        Empezar
      </button>
    </form>

    <script src="pantalla1.js"></script>
  </body>
</html>
