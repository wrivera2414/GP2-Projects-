<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tower Defense</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS Pantalla 1 -->
    <link rel="stylesheet" href="EstiloPantalla1.css" />
  </head>

  <body>
    <main
      class="container d-flex justify-content-center align-items-center min-vh-100"
    >
      <section class="game-form">
        <div class="text-center mb-4">
          <h1 class="game-title">🏰</h1>
          <h1 class="game-title">TOWER DEFENSE</h1>
          <p class="text-light">Configura tu partida</p>
        </div>

        <form id="playerForm">
          <!-- Nombre -->
          <div class="mb-3">
            <label for="playerName" class="form-label">
              Nombre del jugador
            </label>

            <input
              type="text"
              class="form-control"
              id="playerName"
              placeholder="Escribe tu nombre"
              maxlength="20"
              required
            />
          </div>

          <!-- Personaje -->
          <div class="mb-3">
            <label for="character" class="form-label"> Personaje </label>

            <select class="form-select" id="character" required>
              <option value="">Selecciona un personaje</option>
              <option value="guerrero">⚔️ Guerrero</option>
              <option value="mago">🧙 Mago</option>
              <option value="arquero">🏹 Arquero</option>
            </select>
          </div>

          <!-- Dificultad -->
          <div class="mb-3">
            <label for="difficulty" class="form-label"> Dificultad </label>

            <select class="form-select" id="difficulty" required>
              <option value="">Selecciona la dificultad</option>
              <option value="facil">🟢 Fácil</option>
              <option value="medio">🟡 Medio</option>
              <option value="dificil">🔴 Difícil</option>
            </select>
          </div>

          <!-- Nivel -->
          <div class="mb-4">
            <label for="level" class="form-label"> Nivel </label>

            <select class="form-select" id="level" required>
              <option value="">Selecciona el nivel</option>
              <option value="1">Nivel 1</option>
              <option value="2">Nivel 2</option>
              <option value="3">Nivel 3</option>
            </select>
          </div>

          <!-- Botón -->
          <button type="submit" class="btn btn-warning w-100 btn-start">
            ⚔️ Comenzar juego
          </button>
        </form>
      </section>
    </main>

    <script src="js/game.js"></script>
  </body>
</html>
