<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tower Defense - Resultados</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Estilos de la pantalla 3 -->
    <link rel="stylesheet" href="pantalla3.css" />
  </head>

  <body>
    <main class="container py-5">
      <!-- Encabezado -->
      <div class="text-center mb-4">
        <h1>TOWER DEFENSE</h1>
        <h2>Resultados de la partida</h2>

        <p id="nombreJugador">Jugador: esperando resultados...</p>
      </div>

      <!-- Tarjetas de resultados -->
      <div class="row g-3">
        <div class="col-md-6">
          <div class="card p-3 text-center">
            <h3>Puntuación</h3>
            <p id="puntos">0</p>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card p-3 text-center">
            <h3>Oleada alcanzada</h3>
            <p id="oleada">0</p>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card p-3 text-center">
            <h3>Enemigos eliminados</h3>
            <p id="enemigosEliminados">0</p>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card p-3 text-center">
            <h3>Monedas restantes</h3>
            <p id="monedas">0</p>
          </div>
        </div>
      </div>

      <!-- Estado final de la partida -->
      <div class="text-center mt-4">
        <h3 id="estadoPartida">Esperando resultados</h3>

        <button id="jugarOtraVez" class="btn btn-primary mt-3">
          Jugar otra vez
        </button>

        <button id="volverMenu" class="btn btn-secondary mt-3">
          Volver al menú
        </button>

        <!-- Enlace o botón para ir al Ranking -->
        <button
          onclick="
            window.location.href = '../Pantalla4-(Ranking)/pantalla4.html'
          "
          class="btn btn-tertiary mt-3"
        >
          🏆 Ver Tabla de Posiciones
        </button>
      </div>
    </main>

    <!-- JavaScript de la pantalla 3 -->
    <script src="pantalla3.js"></script>
  </body>
</html>
